name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 真实银行接口不在 PR 流程里访问：外站波动不应阻塞合并。
# 采集器用冻结样本做契约测试，真实来源验收在部署阶段单独进行。
env:
  PYTHON_VERSION: "3.12"

jobs:
  static-checks:
    name: 静态检查与单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: 安装依赖
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }}
          uv pip install -e ".[dev]"

      - name: Ruff 检查
        run: uv run ruff check src tests migrations

      - name: Ruff 格式检查
        run: uv run ruff format --check src tests migrations

      - name: Mypy 类型检查
        run: uv run mypy src/ledger

      - name: 单元测试
        env:
          DATABASE_URL: postgresql://ledger:ci-password@localhost:5432/ledger_test
          SESSION_SECRET: qN7x2LpR9vK4mT6wZ8bY3cF5hJ1dG0sA-eU_iO
          APP_ENV: test
          SESSION_COOKIE_SECURE: "false"
        run: uv run pytest tests/unit -v

  integration:
    name: 迁移与集成测试
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: ledger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ledger:ci-password@localhost:5432/ledger_test
      SESSION_SECRET: qN7x2LpR9vK4mT6wZ8bY3cF5hJ1dG0sA-eU_iO
      APP_ENV: test
      SESSION_COOKIE_SECURE: "false"

    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: 安装依赖
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }}
          uv pip install -e ".[dev]"

      - name: 迁移可重复执行
        run: |
          uv run alembic upgrade head
          # 再次执行应为空操作，验证迁移幂等
          uv run alembic upgrade head

      - name: 迁移可回滚
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: 检查模型与迁移一致
        run: |
          # 若模型有未生成迁移的改动，autogenerate 会产出非空内容
          uv run alembic check

      - name: 集成测试
        run: uv run pytest tests/integration tests/contracts -v

      - name: 配置自检
        run: uv run python -m ledger.cli check-config

  build-image:
    name: 构建镜像
    runs-on: ubuntu-latest
    needs: [static-checks, integration]
    steps:
      - uses: actions/checkout@v4

      - name: 构建
        run: docker build -f deploy/Dockerfile -t wealth-ledger:ci .

      - name: 确认镜像以非 root 运行
        run: |
          user=$(docker run --rm wealth-ledger:ci whoami)
          echo "容器用户: $user"
          test "$user" = "ledger"

      - name: 确认导入无副作用
        env:
          DATABASE_URL: postgresql://u:p@unreachable-host:5432/db
          SESSION_SECRET: qN7x2LpR9vK4mT6wZ8bY3cF5hJ1dG0sA-eU_iO
        run: |
          # 数据库不可达时导入应用模块不应报错，也不应建表或启动调度
          docker run --rm -e DATABASE_URL -e SESSION_SECRET wealth-ledger:ci \
            python -c "import ledger.app; print('import ok')"
